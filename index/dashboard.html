<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Absolute Care Dashboard</title>
    <link rel="stylesheet" href="../css/css/dashboard.css" />
  </head>
  <body>
    <header class="topbar">
      <a
        class="brand"
        href="dashboard.html"
        aria-label="AbsoluteCare dashboard"
      >
        <span class="brand-icon">AC</span>
        <span class="brand-name">Absolute<span>Care</span></span>
      </a>

      <nav class="main-nav" aria-label="Main navigation">
        <a class="nav-link active" href="dashboard.html">Dashboard</a>
        <a class="nav-link" href="#appointments">Appointments</a>
        <a class="nav-link" href="#patients">Patients</a>
      </nav>

      <div class="topbar-actions">
        <button
          class="icon-button"
          type="button"
          aria-label="View notifications"
        >
          <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
            <path d="M10 21h4" />
          </svg>
          <span class="notification-dot"></span>
        </button>
        <button
          class="profile-button"
          type="button"
          aria-label="Open account menu"
        >
          <span class="profile-avatar">JD</span>
          <span class="profile-copy">
            <strong>John Doe</strong>
            <small>Administrator</small>
          </span>
          <span class="chevron" aria-hidden="true">&#8964;</span>
        </button>
      </div>
    </header>

    <div class="dashboard-layout">
      <aside class="sidebar" aria-label="Dashboard sidebar">
        <div class="sidebar-heading">
          <span class="sidebar-heading-text">Workspace</span>
          <button
            class="sidebar-toggle"
            id="sidebarToggle"
            type="button"
            aria-label="Hide sidebar"
            aria-expanded="true"
          >
            <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
        </div>

        <nav class="sidebar-nav" aria-label="Dashboard sections">
          <a class="sidebar-link active" href="dashboard.html">
            <span class="sidebar-icon" aria-hidden="true">
              <svg class="ui-icon" viewBox="0 0 24 24">
                <rect x="4" y="4" width="6" height="6" rx="1" />
                <rect x="14" y="4" width="6" height="6" rx="1" />
                <rect x="4" y="14" width="6" height="6" rx="1" />
                <rect x="14" y="14" width="6" height="6" rx="1" />
              </svg>
            </span>
            <span>Overview</span>
          </a>
          <a class="sidebar-link" href="#appointments">
            <span class="sidebar-icon" aria-hidden="true">
              <svg class="ui-icon" viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="16" rx="2" />
                <path d="M16 3v4M8 3v4M3 10h18" />
              </svg>
            </span>
            <span>Appointments</span>
          </a>
          <a class="sidebar-link" href="#patients">
            <span class="sidebar-icon" aria-hidden="true">
              <svg class="ui-icon" viewBox="0 0 24 24">
                <circle cx="9" cy="8" r="3" />
                <path
                  d="M3 20a6 6 0 0 1 12 0M16 11a3 3 0 1 1 2.5 1.3M17 16a5 5 0 0 1 4 4"
                />
              </svg>
            </span>
            <span>Patients</span>
          </a>
          <a class="sidebar-link" href="#therapists">
            <span class="sidebar-icon" aria-hidden="true">
              <svg class="ui-icon" viewBox="0 0 24 24">
                <path d="M12 5v14M5 12h14" />
                <circle cx="12" cy="12" r="9" />
              </svg>
            </span>
            <span>Therapists</span>
          </a>
          <a class="sidebar-link" href="#records">
            <span class="sidebar-icon" aria-hidden="true">
              <svg class="ui-icon" viewBox="0 0 24 24">
                <path d="M6 3h9l3 3v15H6z" />
                <path d="M14 3v4h4M9 12h6M9 16h6" />
              </svg>
            </span>
            <span>Medical Records</span>
          </a>
        </nav>

        <div class="sidebar-footer">
          <a class="sidebar-link" href="#settings">
            <span class="sidebar-icon" aria-hidden="true">
              <svg class="ui-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.4 1.4-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-2v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L9 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H7v-2h.8a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L9 9l1.4-1.4.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V6h2v.4a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L20 9l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v2h-.4a1.7 1.7 0 0 0-1.6 1Z"
                />
              </svg>
            </span>
            <span>Settings</span>
          </a>
          <a class="sidebar-link" href="index.html">
            <span class="sidebar-icon" aria-hidden="true">
              <svg class="ui-icon" viewBox="0 0 24 24">
                <path d="M10 17l5-5-5-5M15 12H3M21 4v16" />
              </svg>
            </span>
            <span>Sign Out</span>
          </a>
        </div>
      </aside>

      <main class="dashboard-content">
        <section id="appointments" class="dashboard-section">
          <h1>Dashboard Overview</h1>
          <p>Manage your clinic activity from the sidebar.</p>
        </section>
      </main>
    </div>
    <script src="../script/dashboard.js"></script>
    <script>
      const roleLabels = {
        admin: "Administrator",
        secretary: "Secretary",
        patient: "Patient",
        therapist: "Therapist",
      };

      const params = new URLSearchParams(window.location.search);
      const role =
        params.get("role") ||
        localStorage.getItem("absocare-user-role") ||
        "admin";
      const roleName = roleLabels[role] || "Administrator";

      const profileName = document.querySelector(".profile-copy strong");
      const profileRole = document.querySelector(".profile-copy small");
      const dashboardTitle = document.querySelector(".dashboard-section h1");
      const dashboardText = document.querySelector(".dashboard-section p");

      if (profileName)
        profileName.textContent =
          localStorage.getItem("absocare-user-name") || "John Doe";
      if (profileRole) profileRole.textContent = roleName;
      if (dashboardTitle) dashboardTitle.textContent = `${roleName} Dashboard`;
      if (dashboardText) {
        dashboardText.textContent = `Welcome back. You are viewing the ${roleName.toLowerCase()} dashboard.`;
      }
    </script>
  </body>
</html>
