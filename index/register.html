<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | AbsoluteCare</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/css/create.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <div class="brand-section">
          <div class="brand-icon">AC</div>
          <h1>Absolute<span>Care</span></h1>
          <p>Physical Therapy Center</p>
        </div>

        <div class="welcome-section">
          <h2>Create an Account</h2>
          <p>Choose your role and complete your details to get started.</p>
        </div>

        <div class="account-type-section">
          <div class="section-title">Select account type</div>

          <div class="account-options">
            <label class="account-option">
              <input type="radio" name="accountType" value="admin" checked />
              <span class="account-card">
                <span class="account-icon">A</span>
                <span class="account-text">
                  <strong>Admin</strong>
                  <small>Full access to system control</small>
                </span>
              </span>
            </label>

            <label class="account-option">
              <input type="radio" name="accountType" value="secretary" />
              <span class="account-card">
                <span class="account-icon">S</span>
                <span class="account-text">
                  <strong>Secretary</strong>
                  <small>Manage schedules and records</small>
                </span>
              </span>
            </label>

            <label class="account-option">
              <input type="radio" name="accountType" value="patient" />
              <span class="account-card">
                <span class="account-icon">P</span>
                <span class="account-text">
                  <strong>Patient</strong>
                  <small>Book sessions and track progress</small>
                </span>
              </span>
            </label>

            <label class="account-option">
              <input type="radio" name="accountType" value="therapist" />
              <span class="account-card">
                <span class="account-icon">T</span>
                <span class="account-text">
                  <strong>Therapist</strong>
                  <small>Manage treatment plans</small>
                </span>
              </span>
            </label>
          </div>
        </div>

        <form id="registerForm" class="create-form">
          <div class="mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <input
              type="text"
              class="form-control"
              id="fullName"
              name="name"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Create a password"
              required
            />
          </div>

          <div class="mb-3">
            <label for="confirmPassword" class="form-label"
              >Confirm Password</label
            >
            <input
              type="password"
              class="form-control"
              id="confirmPassword"
              placeholder="Confirm your password"
              required
            />
          </div>

          <div id="message" class="mt-2" role="alert"></div>

          <button type="submit" class="btn btn-create">Create Account</button>
        </form>

        <div class="login-link">
          Already have an account?
          <a href="index.html">Login here</a>
        </div>
      </div>
    </div>

    <script>
      const registerForm = document.getElementById("registerForm");
      const messageBox = document.getElementById("message");

      const getSelectedRole = () => {
        const selected = document.querySelector(
          'input[name="accountType"]:checked',
        );
        return selected ? selected.value : "patient";
      };

      registerForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const name = document.getElementById("fullName").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;
        const role = getSelectedRole();

        if (password !== confirmPassword) {
          messageBox.style.color = "#dc3545";
          messageBox.textContent = "Passwords do not match.";
          return;
        }

        try {
          const response = await fetch("/api/auth/register", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ name, email, password, role }),
          });

          const responseText = await response.text();
          let data = {};

          if (responseText) {
            try {
              data = JSON.parse(responseText);
            } catch {
              const text = responseText.trim();
              data = {
                message: text.startsWith("<!DOCTYPE html>")
                  ? "The server returned an unexpected response. Please try again."
                  : text || "Registration failed.",
              };
            }
          }

          if (!response.ok) {
            throw new Error(data.message || "Registration failed.");
          }

          localStorage.setItem("absocare-user-role", role);
          localStorage.setItem("absocare-user-name", name);

          messageBox.style.color = "#198754";
          messageBox.textContent = `${data.message} Redirecting to login...`;
          setTimeout(() => {
            window.location.href = `index.html?role=${encodeURIComponent(role)}`;
          }, 600);
        } catch (error) {
          messageBox.style.color = "#dc3545";
          messageBox.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
