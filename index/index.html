<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Absolute_Care_Online</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/css/style.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <!-- Logo / Brand -->
        <div class="brand-section text-center">
          <div class="brand-icon">AC</div>

          <h1>Absolute<span>Care</span></h1>

          <p>Physical Therapy Center</p>
        </div>

        <!-- Welcome -->
        <div class="welcome-section text-center">
          <h2>Welcome to AbsoluteCare</h2>

          <p>
            Your journey to better movement<br />
            and healthier living starts here.
          </p>
        </div>

        <!-- Login Form -->
        <form>
          <div class="mb-3">
            <label for="email" class="form-label"> Email Address </label>

            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label"> Password </label>

            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <div class="text-end mb-4">
            <a href="#" class="forgot-link"> Forgot Password? </a>
          </div>

          <button type="submit" class="btn btn-login w-100">Login</button>
        </form>

        <!-- Signup -->
        <div class="signup-section text-center">
          <p>
            Don't have an account?
            <a href="create.html" class="signup-link"> Create an account </a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
