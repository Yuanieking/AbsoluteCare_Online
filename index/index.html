<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Absolute_Care_Online</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/css/style.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <!-- Logo / Brand -->
        <div class="brand-section text-center">
          <div class="brand-icon">AC</div>

          <h1>Absolute<span>Care</span></h1>

          <p>Physical Therapy Center</p>
        </div>

        <!-- Welcome -->
        <div class="welcome-section text-center">
          <h2>Welcome to AbsoluteCare</h2>

          <p>
            Your journey to better movement<br />
            and healthier living starts here.
          </p>
        </div>

        <div class="account-type-section">
          <div class="section-title">Select account type</div>

          <div class="account-options">
            <label class="account-option">
              <input type="radio" name="accountType" value="admin" checked />
              <span class="account-card">
                <span class="account-icon">A</span>
                <span class="account-text">
                  <strong>Admin</strong>
                  <small>Full access to system control</small>
                </span>
              </span>
            </label>

            <label class="account-option">
              <input type="radio" name="accountType" value="secretary" />
              <span class="account-card">
                <span class="account-icon">S</span>
                <span class="account-text">
                  <strong>Secretary</strong>
                  <small>Manage schedules and records</small>
                </span>
              </span>
            </label>

            <label class="account-option">
              <input type="radio" name="accountType" value="patient" />
              <span class="account-card">
                <span class="account-icon">P</span>
                <span class="account-text">
                  <strong>Patient</strong>
                  <small>Book sessions and track progress</small>
                </span>
              </span>
            </label>

            <label class="account-option">
              <input type="radio" name="accountType" value="therapist" />
              <span class="account-card">
                <span class="account-icon">T</span>
                <span class="account-text">
                  <strong>Therapist</strong>
                  <small>Manage treatment plans</small>
                </span>
              </span>
            </label>
          </div>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
          <div class="mb-3">
            <label for="email" class="form-label"> Email Address </label>

            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label"> Password </label>

            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <div class="text-end mb-4">
            <a href="#" class="forgot-link"> Forgot Password? </a>
          </div>

          <button type="submit" class="btn btn-login w-100">Login</button>
        </form>

        <!-- Signup -->
        <div class="signup-section text-center">
          <p>
            Don't have an account?
            <a href="create.html" class="signup-link"> Create an account </a>
          </p>
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const selectedRole =
        params.get("role") ||
        localStorage.getItem("absocare-user-role") ||
        "patient";

      const roleInput = document.querySelector(
        `input[name="accountType"][value="${selectedRole}"]`,
      );
      if (roleInput) {
        roleInput.checked = true;
      }

      document
        .getElementById("loginForm")
        .addEventListener("submit", (event) => {
          event.preventDefault();

          const chosenRole =
            document.querySelector('input[name="accountType"]:checked')
              ?.value || selectedRole;
          localStorage.setItem("absocare-user-role", chosenRole);
          localStorage.setItem("absocare-user-name", "John Doe");
          window.location.href = `dashboard.html?role=${encodeURIComponent(chosenRole)}`;
        });
    </script>
  </body>
</html>
